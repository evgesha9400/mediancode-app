name: frontend-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'api-spec.yaml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'api-spec.yaml'
      - '.github/workflows/frontend-ci.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: SvelteKit sync
        run: bun run prepare
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}

      - name: svelte-check
        run: bun run check
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}

      - name: Dead code guard
        run: bun run lint:dead

      - name: Consistency check
        run: bun run lint:consistency

      - name: Validate fixtures
        run: bun run test:fixtures:validate

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test:unit

      - name: Coverage
        run: bun run test:coverage

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const coveragePath = 'frontend/coverage/coverage-summary.json';
            if (fs.existsSync(coveragePath)) {
              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
              const total = coverage.total;
              const comment = `## Test Coverage Report

              | Metric | Coverage |
              |--------|----------|
              | Lines | ${total.lines.pct}% |
              | Statements | ${total.statements.pct}% |
              | Functions | ${total.functions.pct}% |
              | Branches | ${total.branches.pct}% |
              `;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  playwright-smoke:
    name: Playwright Smoke Tests
    needs: [lint-and-typecheck, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}

      - name: Smoke tests
        run: bun run test:e2e:smoke:ci
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-smoke-report
          path: frontend/playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-smoke-screenshots
          path: frontend/test-results/
          retention-days: 30

  e2e-crud:
    name: Playwright E2E Tests
    needs: playwright-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}

      - name: E2E CRUD tests
        run: bun run test:e2e:crud:ci
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-crud-report
          path: frontend/playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: e2e-crud-screenshots
          path: frontend/test-results/
          retention-days: 30

  all-tests:
    name: All Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, playwright-smoke, e2e-crud]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.playwright-smoke.result }}" != "success" ]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          if [ "${{ needs.e2e-crud.result }}" != "success" ]; then
            if [ "${{ needs.e2e-crud.result }}" == "skipped" ] && \
               [ "${{ github.ref }}" != "refs/heads/main" ] && \
               [ "${{ github.ref }}" != "refs/heads/develop" ]; then
              echo "E2E CRUD skipped on feature branch — OK"
            else
              echo "E2E CRUD tests failed"
              exit 1
            fi
          fi
          echo "All tests passed!"
