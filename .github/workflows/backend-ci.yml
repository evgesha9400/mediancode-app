name: backend-ci

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'api-spec.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'api-spec.yaml'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: v1-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: v1-poetry-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Pre-commit (Ruff)
        run: poetry run pre-commit run --config config/pre-commit-config.yaml --all-files

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: median_code
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/median_code

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: v1-poetry-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: v1-poetry-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run migrations
        run: poetry run alembic upgrade head

      - name: Run tests
        run: poetry run pytest tests/ -v

  deploy:
    name: Deploy
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Trigger Coolify Deployment
        run: |
          curl --silent --show-error --fail --request GET \
            '${{ vars.COOLIFY_WEBHOOK }}' \
            --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
